name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with the compiler that ships with Windows
        shell: cmd
        run: build.cmd

      # GitHub's Windows machines run as administrator, so this adds real block rules and
      # checks them with real connections.
      - name: Self-test
        timeout-minutes: 5
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'selftest.log'
          $run = Start-Process -FilePath bin\NetMute.exe -ArgumentList 'selftest', '--log', $log -Wait -PassThru
          Get-Content $log
          if ($run.ExitCode -ne 0) { throw "Self-test failed with exit code $($run.ExitCode)" }

      - name: Command-line test
        timeout-minutes: 5
        shell: pwsh
        run: tools\test-cli.ps1 -Exe bin\NetMute.exe

      - uses: actions/upload-artifact@v4
        with:
          name: NetMute
          path: bin/NetMute.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NetMute

      - name: Publish the tested exe
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" NetMute.exe --repo "$GITHUB_REPOSITORY" --title "NetMute $GITHUB_REF_NAME" --generate-notes
